<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Legion Go Media Hub logo: a handheld with a play button on its screen. Colours match ui/app.css. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#7b6cff"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#7b6cff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b0e14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#shine)"/>

  <!-- handheld body -->
  <rect x="52" y="160" width="408" height="192" rx="52" fill="#f5f8ff" filter="url(#shadow)"/>

  <!-- screen -->
  <rect x="140" y="178" width="232" height="156" rx="14" fill="#0b0e14"/>
  <path d="M234 216 L234 296 L300 256 Z" fill="url(#play)" stroke="url(#play)" stroke-width="14" stroke-linejoin="round"/>

  <!-- left side: stick and D-pad -->
  <circle cx="96" cy="222" r="22" fill="#1a2233"/>
  <rect x="87" y="270" width="18" height="46" rx="5" fill="#1a2233"/>
  <rect x="73" y="284" width="46" height="18" rx="5" fill="#1a2233"/>

  <!-- right side: face buttons and stick -->
  <circle cx="416" cy="200" r="9.5" fill="#1a2233"/>
  <circle cx="416" cy="244" r="9.5" fill="#1a2233"/>
  <circle cx="394" cy="222" r="9.5" fill="#1a2233"/>
  <circle cx="438" cy="222" r="9.5" fill="#1a2233"/>
  <circle cx="416" cy="294" r="20" fill="#1a2233"/>
</svg>
